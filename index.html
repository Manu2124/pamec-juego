<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Hospitalario PAMEC</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

/* HEADER */
.header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    background: #34495e;
    position: fixed;
    padding-top: 60px;
}

.sidebar button {
    width: 100%;
    padding: 15px;
    border: none;
    background: none;
    color: white;
    text-align: left;
    cursor: pointer;
}

.sidebar button:hover {
    background: #1abc9c;
}

/* MAIN */
.main {
    margin-left: 220px;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* BOTONES */
.opcion {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #ecf0f1;
}

.correcto { background: #2ecc71; color: white; }
.incorrecto { background: #e74c3c; color: white; }

/* TABLA */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ccc;
    text-align: center;
}

th {
    background: #3498db;
    color: white;
}

/* LOGIN */
#login {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #2c3e50;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

input {
    padding: 10px;
    width: 200px;
    margin-bottom: 10px;
}

button.start {
    background: #3498db;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="login-box">
        <h2>Ingreso al Sistema</h2>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre">
        <br>
        <button class="start" onclick="iniciar()">Ingresar</button>
    </div>
</div>

<div class="header">
    <h1>🏥 Sistema PAMEC</h1>
    <div id="usuario"></div>
</div>

<div class="sidebar">
    <button onclick="mostrar('inicio')">🏠 Inicio</button>
    <button onclick="mostrar('juego')">🎮 Juego</button>
    <button onclick="mostrar('ranking')">🏆 Ranking</button>
</div>

<div class="main">

<div id="inicio" class="card">
    <h2>Bienvenido</h2>
    <p>Sistema de capacitación basado en el enfoque centrado en el usuario.</p>
    <h3>Puntaje actual: <span id="puntajeBox">0</span></h3>
</div>

<div id="juego" class="card" style="display:none;">
    <h2>🎮 Juego</h2>
    <h3 id="pregunta"></h3>
    <div id="opciones"></div>
    <p id="resultado"></p>
</div>

<div id="ranking" class="card" style="display:none;">
    <h2>🏆 Mejores Puntajes</h2>
    <table>
        <thead>
            <tr>
                <th>Posición</th>
                <th>Nombre</th>
                <th>Puntaje</th>
            </tr>
        </thead>
        <tbody id="tablaRanking"></tbody>
    </table>
</div>

</div>

<script>

let usuario = "";
let puntaje = 0;
let indice = 0;

let preguntas = [
{
    pregunta: "Paciente molesto por demora",
    opciones: [
        {texto:"Ignorarlo", correcta:false},
        {texto:"Responder mal", correcta:false},
        {texto:"Escuchar y explicar", correcta:true}
    ]
},
{
    pregunta: "Adulto mayor confundido",
    opciones: [
        {texto:"Explicar rápido", correcta:false},
        {texto:"No explicar", correcta:false},
        {texto:"Explicar con paciencia", correcta:true}
    ]
},
{
    pregunta: "Paciente ansioso",
    opciones: [
        {texto:"Decir que espere", correcta:false},
        {texto:"Ignorarlo", correcta:false},
        {texto:"Dar información clara", correcta:true}
    ]
}
];

function iniciar(){
    let nombre = document.getElementById("nombre").value;
    if(nombre === ""){
        alert("Ingrese su nombre");
        return;
    }
    usuario = nombre;
    document.getElementById("usuario").innerText = "👤 " + usuario;
    document.getElementById("login").style.display = "none";
    cargarPregunta();
}

function mostrar(sec){
    document.getElementById("inicio").style.display="none";
    document.getElementById("juego").style.display="none";
    document.getElementById("ranking").style.display="none";
    document.getElementById(sec).style.display="block";

    if(sec==="ranking") cargarRanking();
}

function cargarPregunta(){
    let p = preguntas[indice];
    document.getElementById("pregunta").innerText = p.pregunta;

    let html="";
    p.opciones.forEach((op,i)=>{
        html += `<button class="opcion" onclick="responder(${i})">${op.texto}</button>`;
    });

    document.getElementById("opciones").innerHTML = html;
}

function responder(i){
    let correcta = preguntas[indice].opciones[i].correcta;
    let botones = document.querySelectorAll(".opcion");

    botones.forEach(b=>b.disabled=true);

    if(correcta){
        botones[i].classList.add("correcto");
        document.getElementById("resultado").innerText="✅ +10";
        puntaje+=10;
    } else {
        botones[i].classList.add("incorrecto");
        document.getElementById("resultado").innerText="❌";
    }

    document.getElementById("puntajeBox").innerText = puntaje;

    setTimeout(()=>{
        indice++;
        if(indice<preguntas.length){
            cargarPregunta();
        } else {
            guardarPuntaje();
            alert("Juego terminado. Puntaje: "+puntaje);
        }
    },1500);
}

function guardarPuntaje(){
    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];
    ranking.push({nombre: usuario, puntaje: puntaje});

    ranking.sort((a,b)=>b.puntaje-a.puntaje);
    ranking = ranking.slice(0,5);

    localStorage.setItem("ranking", JSON.stringify(ranking));
}

function cargarRanking(){
    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];
    let html="";

    ranking.forEach((r,i)=>{
        html+=`<tr>
        <td>${i+1}</td>
        <td>${r.nombre}</td>
        <td>${r.puntaje}</td>
        </tr>`;
    });

    document.getElementById("tablaRanking").innerHTML = html;
}

</script>

</body>
</html>
